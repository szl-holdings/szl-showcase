name: Atlas source contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  atlas-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Check retained source syntax
        run: |
          node --check atlas/build-atlas.mjs
          node --check atlas/tests/anatomy-projection.test.mjs
          node --check atlas/tests/source-binding.test.mjs
      - name: Verify retained projection and interactions
        run: node atlas/tests/anatomy-projection.test.mjs
      - name: Verify exact source hashes and offline reproduction
        run: node atlas/tests/source-binding.test.mjs
